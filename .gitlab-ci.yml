# GitLab CI/CD Pipeline for Enterprise Application

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_REGISTRY: "registry.gitlab.com/$CI_PROJECT_PATH"
  DOCKER_DRIVER: overlay2
  SONAR_HOST_URL: "http://sonarqube:9000"

stages:
  - build
  - test
  - quality
  - package
  - deploy

# Backend Build
build:backend:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn clean compile -B
  cache:
    paths:
      - backend/.m2/repository
  artifacts:
    paths:
      - backend/target
    expire_in: 1 hour
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

# Frontend Build
build:frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm run build -- --configuration=production
  cache:
    paths:
      - frontend/node_modules
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 hour
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# Backend Tests
test:backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
    SPRING_DATASOURCE_USERNAME: test
    SPRING_DATASOURCE_PASSWORD: test
  script:
    - cd backend
    - mvn test -B
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/target/site/cobertura/coverage.xml
    paths:
      - backend/target/site/jacoco
    expire_in: 30 days
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

# Frontend Tests
test:frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm run test:ci
  coverage: '/Statements\s+:\s+([0-9.]+)%/'
  artifacts:
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage
    expire_in: 30 days
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# Backend Linting
lint:backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn checkstyle:check -B
  allow_failure: true
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

# Frontend Linting
lint:frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci --legacy-peer-deps
    - npm run lint
  allow_failure: true
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# SonarQube Analysis
sonarqube:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=$CI_PROJECT_NAME
      -Dsonar.sources=.
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.java.binaries=backend/target/classes
      -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
      -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
  allow_failure: true
  only:
    refs:
      - main
      - develop

# Build Backend Docker Image
docker:build:backend:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -t $DOCKER_REGISTRY/backend:$CI_COMMIT_TAG -t $DOCKER_REGISTRY/backend:latest ./backend
    - docker push $DOCKER_REGISTRY/backend:$CI_COMMIT_TAG
    - docker push $DOCKER_REGISTRY/backend:latest
  only:
    - tags

# Build Frontend Docker Image
docker:build:frontend:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -t $DOCKER_REGISTRY/frontend:$CI_COMMIT_TAG -t $DOCKER_REGISTRY/frontend:latest ./frontend
    - docker push $DOCKER_REGISTRY/frontend:$CI_COMMIT_TAG
    - docker push $DOCKER_REGISTRY/frontend:latest
  only:
    - tags

# Deploy to Development
deploy:dev:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: development
    url: https://dev.example.com
  before_script:
    - kubectl config use-context dev-cluster
  script:
    - kubectl apply -f k8s/dev/ --namespace=dev
    - kubectl rollout status deployment/backend -n dev
    - kubectl rollout status deployment/frontend -n dev
  only:
    refs:
      - develop

# Deploy to Staging
deploy:staging:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: staging
    url: https://staging.example.com
  before_script:
    - kubectl config use-context staging-cluster
  script:
    - kubectl apply -f k8s/staging/ --namespace=staging
    - kubectl rollout status deployment/backend -n staging
    - kubectl rollout status deployment/frontend -n staging
  only:
    refs:
      - main
  when: manual

# Deploy to Production
deploy:prod:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://www.example.com
  before_script:
    - kubectl config use-context prod-cluster
  script:
    - kubectl apply -f k8s/prod/ --namespace=production
    - kubectl rollout status deployment/backend -n production
    - kubectl rollout status deployment/frontend -n production
  only:
    refs:
      - main
  when: manual
  allow_failure: false
