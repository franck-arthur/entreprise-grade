# Docker environment configuration

spring:
  # Security OAuth2 Resource Server (Keycloak)
  security:
    oauth2:
      resourceserver:
        jwt:
          # CRITICAL: Frontend gets tokens with issuer "http://localhost:8180/..."
          # Backend in Docker must validate these tokens by reaching Keycloak
          # Use 'keycloak:8080' (Docker service name) to validate tokens
          issuer-uri: http://keycloak:8080/realms/enterprise-realm
          jwk-set-uri: http://keycloak:8080/realms/enterprise-realm/protocol/openid-connect/certs
          # Note: This creates an issuer mismatch that needs custom validation

  # JPA - use update mode for schema management in Docker
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: update

# Keycloak Admin Client
keycloak:
  auth-server-url: http://keycloak:8080
  realm: enterprise-realm
  resource: enterprise-backend
  credentials:
    secret: enterprise-backend-secret-key-2024
  admin:
    username: admin
    password: admin
    client-id: admin-cli

# Logging - console only
logging:
  level:
    root: INFO
    com.enterprise.app: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# Application properties
app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000,http://localhost:80,http://localhost
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
    allow-credentials: true
    max-age: 3600
  storage:
    s3:
      endpoint: http://garage:3900
      access-key: enterprise-app-key
      secret-key: enterprise-app-secret
      bucket-name: enterprise-storage
      region: garage
