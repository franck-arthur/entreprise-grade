# Development environment configuration

spring:
  # PostgreSQL datasource
  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-Dev

  # JPA
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
    hibernate:
      ddl-auto: validate

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  # Elasticsearch
  elasticsearch:
    uris: http://localhost:9200
    username:
    password:
    connection-timeout: 5s
    socket-timeout: 30s

  # Security OAuth2 Resource Server (Keycloak)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/enterprise-realm
          jwk-set-uri: http://localhost:8180/realms/enterprise-realm/protocol/openid-connect/certs

# Keycloak Admin Client
keycloak:
  auth-server-url: http://localhost:8180
  realm: enterprise-realm
  resource: backend-client
  credentials:
    secret: your-client-secret-here
  admin:
    username: admin
    password: admin
    client-id: admin-cli

# Logging
logging:
  level:
    root: INFO
    com.enterprise.app: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.elasticsearch: DEBUG
  file:
    name: logs/application-dev.log
    max-size: 10MB
    max-history: 7

# Server
server:
  port: 8080
  error:
    include-stacktrace: on_param

# SpringDoc
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

# Development-specific application properties
app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000,http://localhost:80
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
    allow-credentials: true
    max-age: 3600
