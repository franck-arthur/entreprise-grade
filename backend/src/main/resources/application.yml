spring:
  application:
    name: enterprise-app

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA / Hibernate
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: validate

  # Flyway migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Jackson JSON
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: Europe/Paris

  # Multipart file upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour in milliseconds

  # Redis
  data:
    redis:
      repositories:
        enabled: false

  # Spring Batch configuration
  batch:
    # Tables Spring Batch dans le schéma principal
    jdbc:
      initialize-schema: always
    job:
      # Ne pas exécuter les jobs au démarrage
      enabled: false

# Server configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  http2:
    enabled: true

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    com.enterprise.app: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc OpenAPI 3
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    default-models-expand-depth: 1
    default-model-expand-depth: 1
  show-actuator: true

# Application custom properties
app:
  name: ${spring.application.name}
  version: @project.version@
  description: Enterprise-grade application with Spring Boot

  # CORS configuration
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:80
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

  # Pagination defaults
  pagination:
    default-page-size: 20
    max-page-size: 100

  # CSV Export configuration
  csv-export:
    # Répertoire par défaut pour les exports CSV
    default-output-directory: ${CSV_EXPORT_OUTPUT_DIR:/tmp/csv-exports}

    # Configuration du scheduler automatique
    scheduler:
      enabled: ${CSV_EXPORT_SCHEDULER_ENABLED:true}
      test-export:
        enabled: ${CSV_EXPORT_TEST_ENABLED:false}

    # Monitoring des exports
    monitoring:
      enabled: ${CSV_EXPORT_MONITORING_ENABLED:true}
      max-duration-hours: 4
      alert-duration-hours: 1

    # Configuration des performances
    performance:
      chunk-size: ${CSV_EXPORT_CHUNK_SIZE:500}
      fetch-size: ${CSV_EXPORT_FETCH_SIZE:1000}
      excel-chunk-size: ${EXCEL_IMPORT_CHUNK_SIZE:50}

# Spring Batch configuration (fusionné dans la section spring principale)

# Resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - com.enterprise.app.domain.exception.BusinessException

  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

  retry:
    configs:
      default:
        registerHealthIndicator: true
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - java.io.IOException
        ignoreExceptions:
          - com.enterprise.app.domain.exception.BusinessException
